name: Refresh quotes snapshot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/holdings.csv"
      - "data/monitored.csv"
      - "scripts/refresh.mjs"
      - "js/session.js"
      - ".github/workflows/refresh-quotes.yml"

permissions:
  contents: write

concurrency:
  group: refresh-quotes-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh shared snapshot
        run: node scripts/refresh.mjs
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged"
            exit 0
          fi
          git commit -m "chore: refresh quote snapshot"
          git push
